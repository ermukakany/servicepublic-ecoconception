name: Contrôle d'écoconception

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils
        run: |
          npm install -g http-server lighthouse

      - name: Lancer un serveur local
        run: |
          http-server . -p 8080 &
          sleep 5

      - name: Générer le rapport Lighthouse
        run: |
          lighthouse http://localhost:8080 \
            --chrome-flags="--headless" \
            --output=html \
            --output-path=rapport-lighthouse.html

      - name: Contrôler le budget environnemental
        run: |
          chmod +x ecoindex.sh
          ./ecoindex.sh

      - name: Sauvegarder le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapport-lighthouse
          path: rapport-lighthouse.html
