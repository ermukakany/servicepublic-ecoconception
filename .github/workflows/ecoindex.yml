name: Contrôle d'écoconception

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer EcoIndex CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecoindex-cli
          python -m playwright install chromium

      - name: Vérifier EcoIndex CLI
        run: |
          ecoindex-cli --help
          ecoindex-cli analyze --help
      - name: Installer les outils Lighthouse
        run: |
          npm install -g http-server lighthouse

      - name: Lancer un serveur local
        run: |
          http-server . -p 8080 &
          sleep 5

      - name: Mesurer avec EcoIndex
        run: |
          ecoindex-cli analyze http://localhost:8080 --output ecoindex-results.json

      - name: Afficher les résultats EcoIndex
        run: |
          cat ecoindex-results.json

      - name: Générer le rapport Lighthouse
        run: |
          lighthouse http://localhost:8080 \
            --chrome-flags="--headless" \
            --output=html \
            --output-path=rapport-lighthouse.html

      - name: Sauvegarder les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapports-ecoconception
          path: |
            rapport-lighthouse.html
            ecoindex-results.json
